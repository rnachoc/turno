[project]
name = "turno-agents"
version = "0.1.0"
description = "AI agents for Turno: they talk to patients and propose actions to the core."
authors = [{ name = "Ignacio Rodriguez Caro", email = "rnachoccontact@gmail.com" }]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162,<1",
    "httpx2>=2.16,<3",
    "pydantic-settings>=2.16,<3",
    "temporalio>=1.35,<2",
    # Windows and slim images ship no time zone database.
    "tzdata>=2026.1",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
    "mypy>=2.4,<3",
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4,<2",
    "pyyaml>=6.0,<7",
    "ruff>=0.17,<1",
    "types-pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turno_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not integration and not live and not e2e'"
filterwarnings = ["error"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the real core running; set TURNO_CORE_URL and TURNO_API_TOKEN_AGENTS",
    "live: spends the author's Claude plan; never runs in CI",
    "e2e: needs the whole stack running with the e2e-clinic tenant",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "SIM", "RUF", "ANN", "D"]
# JSON from the core is typed as Any on purpose: its contract is checked by the integration tests.
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D104", "E501", "RUF001"]
# Fixed texts for patients read better on one line.
"src/turno_agents/prompts.py" = ["E501"]
# Instructions and messages read better on one line.
"evals/**" = ["E501"]
"demo/**" = ["E501", "T201", "S603", "S607", "S608"]
# Attacks read better on one line, and they are made of the things these rules forbid.
"security/**" = ["E501", "T201", "RUF001", "S101", "S105", "S106", "D103", "D102", "D105", "D107"]

[tool.mypy]
strict = true
files = ["src", "tests", "evals", "demo", "security"]
