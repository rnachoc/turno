[project]
name = "turno-agents"
version = "0.1.0"
description = "AI agents for Turno: they talk to patients and propose actions to the core."
authors = [{ name = "Ignacio Rodriguez Caro", email = "rnachoccontact@gmail.com" }]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16,<3",
    "mypy>=2.4,<3",
    "pytest>=9.2,<10",
    "ruff>=0.17,<1",
]

[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turno_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "SIM", "RUF", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
