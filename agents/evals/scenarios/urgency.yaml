# Fixed messages, because the model must never see them. These cost nothing to run.
- id: urgent-cannot-breathe
  category: urgency
  script: ["Se me ha hinchado la garganta y no puedo respirar bien"]
  expect:
    handed_over: true
    handover_reason: triage_emergency
    model_not_called: true
    reply_matches: ["112"]

