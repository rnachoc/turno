version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /core
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /agents
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/core, /agents]
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
