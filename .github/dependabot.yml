version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /core
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /agents
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/core, /agents, /console]
    schedule:
      interval: weekly
    # Runtime versions are a decision of ADR 3, not a routine update: Java stays on its LTS release
    # and Python on 3.13, matching CI and the project's requires-python.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
