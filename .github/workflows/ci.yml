# Author: Ignacio Rodriguez Caro <rnachoccontact@gmail.com>
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Java)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test against a real PostgreSQL
        working-directory: core
        run: ./mvnw -B -ntp verify

  agents:
    name: Agents (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest

  tenants:
    name: Tenant configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uvx check-jsonschema==0.39.0 --check-metaschema config/tenant.schema.json
      - run: uvx check-jsonschema==0.39.0 --schemafile config/tenant.schema.json config/tenants/*.yaml

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  stack:
    name: Full stack smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cp .env.example .env
      - name: Start the stack and wait until every service is healthy
        run: docker compose up --build --detach --wait --wait-timeout 180
      - run: curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health
      - run: curl --fail --silent --show-error http://127.0.0.1:8000/health
      - name: The API refuses anonymous callers and serves the demo clinic to the agents
        run: |
          set -a; . ./.env; set +a
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/clinic)" = 401
          curl --fail --silent --show-error --header "Authorization: Bearer $TURNO_API_TOKEN_AGENTS" \
            http://127.0.0.1:8080/api/v1/clinic | grep --quiet '"id":"mirador-dental"'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
