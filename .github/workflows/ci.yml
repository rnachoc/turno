# Author: Ignacio Rodriguez Caro <rnachoccontact@gmail.com>
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Java)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test against a real PostgreSQL
        working-directory: core
        run: ./mvnw -B -ntp verify

  agents:
    name: Agents (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest
      - name: Check the recorded evaluations, with no model and no core
        run: uv run --locked python -m evals gate

  tenants:
    name: Tenant configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uvx check-jsonschema==0.39.0 --check-metaschema config/tenant.schema.json
      - run: uvx check-jsonschema==0.39.0 --schemafile config/tenant.schema.json config/tenants/*.yaml

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks and verify its checksum
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --quiet
          tar --extract --gzip --file "$archive" gitleaks
      # The binary rather than gitleaks-action: on a push the action only scans the new commits,
      # and it crashes when those include the root commit. A leak stays in the history forever.
      - name: Scan the whole history
        run: ./gitleaks git . --redact --no-banner

  stack:
    name: Full stack smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cp .env.example .env
      - name: Start the stack and wait until every service is healthy
        run: docker compose up --build --detach --wait --wait-timeout 180
      - run: curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health
      - run: curl --fail --silent --show-error http://127.0.0.1:8000/health
      - name: The API refuses anonymous callers and serves the demo clinic to the agents
        run: |
          set -a; . ./.env; set +a
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/clinic)" = 401
          curl --fail --silent --show-error --header "Authorization: Bearer $TURNO_API_TOKEN_AGENTS" \
            http://127.0.0.1:8080/api/v1/clinic | grep --quiet '"id":"mirador-dental"'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - name: Check the agents against the real core, with a scripted model
        working-directory: agents
        run: uv run --locked --env-file ../.env pytest -m integration
        env:
          TURNO_CORE_URL: http://127.0.0.1:8080
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
