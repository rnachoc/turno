#
# Serves the console and passes on the only part of the API it uses, from the same origin, so the
# core needs no CORS and the browser needs no address other than this one.

server_tokens off;
# Docker's resolver, so that a restarted core with a new address is found again.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 64k;

    set $core http://core:8080;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/v1/clinic {
        limit_except GET { deny all; }
        include /etc/nginx/proxy.conf;
    }

    location /api/v1/staff/ {
        include /etc/nginx/proxy.conf;
    }

    # Nothing else of the API or of the core's actuator is reachable from here.
    location /api/ {
        include /etc/nginx/security-headers.conf;
        return 404;
    }

    # The names of these files change with their content, so they can be kept for good.
    location ~ "-[A-Z0-9]{8}\.(js|css)$" {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
