# Author: Ignacio Rodriguez Caro <rnachoccontact@gmail.com>
name: turno

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.6-alpine # Keep in sync with TestcontainersConfiguration.POSTGRES_IMAGE.
    environment:
      POSTGRES_DB: turno
      POSTGRES_USER: turno
      POSTGRES_PASSWORD: ${TURNO_DB_PASSWORD:?Copy .env.example to .env and set TURNO_DB_PASSWORD}
    # PostgreSQL 18 images keep their data in a versioned folder below this path.
    volumes:
      - postgres-data:/var/lib/postgresql
    # No published port: only services on this network can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turno -d turno"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Applies the migrations and exits. Only this step knows the owner's password.
  migrate:
    <<: *hardening
    image: turno-core
    build: ./core
    restart: "no"
    environment:
      SPRING_PROFILES_ACTIVE: migrate
      TURNO_DB_URL: jdbc:postgresql://postgres:5432/turno
      TURNO_DB_USER: turno
      TURNO_DB_PASSWORD: ${TURNO_DB_PASSWORD:?Copy .env.example to .env and set TURNO_DB_PASSWORD}
      TURNO_DB_APP_PASSWORD: ${TURNO_DB_APP_PASSWORD:?Copy .env.example to .env and set TURNO_DB_APP_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /tmp

  core:
    <<: *hardening
    image: turno-core
    build: ./core
    environment:
      TURNO_DB_URL: jdbc:postgresql://postgres:5432/turno
      TURNO_DB_APP_PASSWORD: ${TURNO_DB_APP_PASSWORD:?Copy .env.example to .env and set TURNO_DB_APP_PASSWORD}
      TURNO_API_TOKEN_AGENTS: ${TURNO_API_TOKEN_AGENTS:?Copy .env.example to .env and set TURNO_API_TOKEN_AGENTS}
      TURNO_API_TOKEN_STAFF: ${TURNO_API_TOKEN_STAFF:?Copy .env.example to .env and set TURNO_API_TOKEN_STAFF}
      TURNO_API_TOKEN_WORKFLOWS: ${TURNO_API_TOKEN_WORKFLOWS:?Copy .env.example to .env and set TURNO_API_TOKEN_WORKFLOWS}
      TURNO_TENANT_FILE: /etc/turno/tenant.yaml
      TURNO_METRICS_EXPORT: ${TURNO_METRICS_EXPORT:-false}
      TURNO_OTLP_METRICS_URL: http://grafana:4318/v1/metrics
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${TURNO_CORE_PORT:-8080}:8080"
    volumes:
      - ./config/tenants/${TURNO_TENANT:-mirador-dental}.yaml:/etc/turno/tenant.yaml:ro
    tmpfs:
      - /tmp
    # The JRE image ships neither curl nor wget, so the probe speaks HTTP through bash.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"status":"UP"' <&3
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s

  # The development server, with its state on a volume: enough for one machine. See docs/adr/0012.
  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    # On its home folder, because a new volume takes the owner of the folder it covers, and the image
    # rightly does not run as root.
    volumes:
      - temporal-data:/home/temporal
    # Temporal's Web UI, which shows each workflow's history. It has no login, so localhost only.
    ports:
      - "127.0.0.1:${TURNO_TEMPORAL_UI_PORT:-8233}:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Runs the durable workflows. It uses the agents' image but has no agent, model or staff access.
  worker:
    <<: *hardening
    image: turno-agents
    build: ./agents
    entrypoint: ["python", "-m", "turno_agents.workflows.worker"]
    environment:
      TURNO_CORE_URL: http://core:8080
      TURNO_API_TOKEN_WORKFLOWS: ${TURNO_API_TOKEN_WORKFLOWS:?Copy .env.example to .env and set TURNO_API_TOKEN_WORKFLOWS}
      TURNO_TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      core:
        condition: service_healthy
      temporal:
        condition: service_healthy
    tmpfs:
      - /tmp

  agents:
    <<: *hardening
    image: turno-agents
    build: ./agents
    # No model here: the container has no Claude login, so it serves everything but conversations.
    # To chat, run the service on the host with `make agents`. See docs/adr/0009.
    environment:
      TURNO_CORE_URL: http://core:8080
      TURNO_API_TOKEN_AGENTS: ${TURNO_API_TOKEN_AGENTS:?Copy .env.example to .env and set TURNO_API_TOKEN_AGENTS}
      TURNO_LLM_BACKEND: none
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TURNO_AGENTS_PORT:-8000}:8000"
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  console:
    <<: *hardening
    image: turno-console
    build: ./console
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:4200:8080"
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Everything for metrics in one image, which is large and so only starts when asked for.
  grafana:
    image: grafana/otel-lgtm:0.39.0
    profiles: [observability]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/turno.yaml:ro
      - ./observability/turno.json:/otel-lgtm/grafana-dashboard-turno.json:ro
    restart: unless-stopped

volumes:
  postgres-data:
  temporal-data:
