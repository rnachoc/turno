# Spring reads this file on top of the main application.yaml in every test.
spring:
  flyway:
    # Decided before the container's properties exist, so it cannot live with them.
    enabled: true

turno:
  tenant-file: src/test/resources/tenants/test-clinic.yaml
  # A frozen clock would otherwise put every test in one minute. RateLimitIT sets its own.
  rate-limit:
    agents-per-minute: 1000000
    staff-per-minute: 1000000
    workflows-per-minute: 1000000
    failed-authentications-per-minute: 1000000
  security:
    agents-token: test-agents-token-0123456789-abcdef
    staff-token: test-staff-token-0123456789-abcdefg
    workflows-token: test-workflows-token-0123456789-abc
  jobs:
    # Tests run each job on demand, and a timer running in the background would make them flaky.
    enabled: false
