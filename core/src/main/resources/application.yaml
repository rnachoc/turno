spring:
  application:
    name: turno-core
  datasource:
    url: ${TURNO_DB_URL:jdbc:postgresql://localhost:5432/turno}
    # A restricted role, not the owner: see docs/adr/0011. Migrations run in a separate step.
    username: turno_app
    # No default on purpose: without this variable the database rejects the connection and the
    # service does not start.
    password: ${TURNO_DB_APP_PASSWORD}
  flyway:
    enabled: false
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      # An agent that invents a field, such as a price, gets an error and not a silent success.
      fail-on-unknown-properties: true

turno:
  tenant-file: ${TURNO_TENANT_FILE}
  security:
    agents-token: ${TURNO_API_TOKEN_AGENTS}
    staff-token: ${TURNO_API_TOKEN_STAFF}
    workflows-token: ${TURNO_API_TOKEN_WORKFLOWS}
  jobs:
    enabled: true

server:
  port: ${TURNO_CORE_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  # Metrics only leave for an endpoint that someone has asked for. See docs/adr/0014.
  otlp:
    metrics:
      export:
        enabled: ${TURNO_METRICS_EXPORT:false}
        url: ${TURNO_OTLP_METRICS_URL:http://127.0.0.1:4318/v1/metrics}
        step: 30s
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # A core without its database cannot serve anything, so it must not report itself ready.
        # Liveness stays independent: restarting the process would not bring the database back.
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: false
