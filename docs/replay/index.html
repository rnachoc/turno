<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">

  <header class="bar">

  <section class="hero">
    <h1>What the agent really said.</h1>
    <p class="lead">Recorded conversations between a fictional clinic's agent and simulated patients. <strong>The model proposes, the code decides.</strong> Open one to see what the code did about it. Failures stay in, and all data is synthetic.</p>

    <p id="summary" class="summary" role="status"></p>

  <main id="rows" class="rows"></main>
  <dialog id="detail" aria-labelledby="detail-title"></dialog>
